name: Build and Deliver Disk Image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    name: Build c.img
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            nasm \
            binutils \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            qemu-system-x86

      - name: Configure project
        run: cmake -S . -B build -G Ninja

      - name: Build image target
        run: cmake --build build --target image -j"$(nproc)"

      - name: Upload pre-smoke image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cimg-presmoke-${{ github.run_number }}
          path: build/c.img
          if-no-files-found: warn
          retention-days: 7

      - name: Smoke test boot with QEMU
        env:
          QEMU_SMOKE_TIMEOUT_SEC: 30
          QEMU_SMOKE_READY_EXIT_CODE: 33
        run: bash qemu/smoke_boot.sh

      - name: Upload QEMU smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-smoke-logs-${{ github.run_number }}
          path: |
            build/qemu-smoke-debugcon.log
            build/qemu-smoke-stdout.log
            build/qemu-smoke-stderr.log
          if-no-files-found: warn
          retention-days: 7

      - name: Generate checksum
        run: |
          sha256sum build/c.img > build/c.img.sha256
          ls -lh build/c.img build/c.img.sha256

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cimg-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            build/c.img
            build/c.img.sha256
          if-no-files-found: error
          retention-days: 30